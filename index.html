<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maestro Roshi</title>
    <link rel="stylesheet" href="assets/scss/styles.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="icon" href="assets/img/roshiico.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <nav class="nav container">
        <a href="#" class="nav__logo"> ROSHI </a>
        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="#" class="nav__link">Home</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Acerca de</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Contacto</a>
            </li>
          </ul>
          <div class="nav__close" id="nav-close">
            <i class="bx bx-x"></i>
          </div>
        </div>
        <!-- TOGGLE -->
        <div class="nav__toggle" id="nav-toggle">
          <i class="bx bx-grid-alt"></i>
        </div>
      </nav>
    </header>
    <!-- MAIN -->
    <main class="main">

      <!-- AUTHENTICATION -->
      <section class="auth container" id="auth-section">
        <div class="auth__forms">
          <!-- Registration Form -->
          <form class="auth__form" id="register-form">
            <h2 class="auth__title">Register</h2>
            <div class="auth__input-group">
              <label for="register-email">Email</label>
              <input type="email" id="register-email" required />
            </div>
            <div class="auth__input-group">
              <label for="register-password">Password</label>
              <input type="password" id="register-password" required />
            </div>
            <button type="submit" class="auth__button">Register</button>
          </form>

          <!-- Login Form -->
          <form class="auth__form" id="login-form">
            <h2 class="auth__title">Login</h2>
            <div class="auth__input-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" required />
            </div>
            <div class="auth__input-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required />
            </div>
            <button type="submit" class="auth__button">Login</button>
          </form>
        </div>
      </section>

      <!-- PROFILE -->
      <section class="profile container" id="profile-section" style="display: none;">
        <h2 class="profile__title">User Profile</h2>
        <div id="profile-data">
          <!-- Profile data will be displayed here -->
        </div>
        <button id="logout-button" class="auth__button">Logout</button>
      </section>

      <!-- MESSAGES -->
      <section class="messages container" id="message-section">
        <!-- Messages will be displayed here -->
      </section>

      <!-- HOME -->
      <section class="home">
        <div class="home__container container">
          <div class="home__data">
            <span class="home__subtitle"> Maestro Roshi </span>
            <h1 class="home__title">Entrenamos?</h1>
            <p class="home__description">
              He entrenado a los mejores <br />
              guerreros saiyajin. <br />
              a Sebastian por ejemplo
            </p>
            <a href="#" class="home__button"> Entrenar </a>
          </div>
          <div class="home__img">
            <img src="assets/img/roshi.png" />
          </div>
        </div>
        <!-- FOOTER -->
        <footer class="home__footer">
          <span>Roshi Page</span>
          <span>|</span>
          <span>company</span>
        </footer>
      </section>
    </main>
    <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
